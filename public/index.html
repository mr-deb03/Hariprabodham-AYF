<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!--
      Google Analytics (GA4) — property G-KTQR53PVPR.

      Placed immediately after <meta charset> rather than literally first in
      <head>: the character encoding has to appear within the first 1024 bytes
      of the document, and putting a script above it risks pushing it out.
      Everything else still loads after this, so the tag is as early as it can
      safely be.

      This is a single-page app with one index.html, so this one tag covers
      every route — no per-page copies, which is what Google's "don't add more
      than one" warning is about.

      No route-change tracking is wired up here. GA4's Enhanced Measurement has
      a "page changes based on browser history events" option that is meant to
      cover React Router navigation, and adding our own listener on top would
      double-count every screen — so the correct order is to check GA Realtime
      first and only add one if inner pages genuinely never appear.

      Local testing was inconclusive: gtag fired once on load and nothing on a
      client-side nav to /about, but measurement hits were blocked in that test
      and the property config may not apply off the live domain. Verify on the
      real site before concluding either way.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KTQR53PVPR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-KTQR53PVPR');
    </script>

    <link rel="icon" href="%PUBLIC_URL%/HPAYF.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFF8F0" />
    <meta
      name="description"
      content="HariPrabodham Atmiya Youth Foundation, Bhandup — a spiritual family devoted to seva, smruti and atmiyata, nurturing youth, families and communities through faith and selfless service."
    />

    <!-- Premium spiritual typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>HariPrabodham Atmiya Youth Foundation</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
